<svg viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Basic P&amp;ID example</title>
<desc>A simplified P&amp;ID showing vessel V-100 feeding pump P-101, through control valve FCV-1042 to vessel V-200, with pressure transmitter PT-3001, level transmitter LT-3005, relief valve PSV-101 to the flare header, and control loop FIC-1042 to FCV-1042.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- PSV and flare header -->
<rect x="50" y="40" width="90" height="36" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="95" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">PSV-101</text>

<rect x="500" y="40" width="130" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="565" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Flare header</text>

<line x1="140" y1="58" x2="500" y2="58" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="110" y1="76" x2="110" y2="140" stroke="#3d3d3a" stroke-width="0.5"/>

<!-- Instruments -->
<circle cx="95" cy="95" r="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="95" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">PT</text>
<text x="117" y="99" font-family="sans-serif" font-size="12" fill="#3d3d3a">PT-3001</text>
<line x1="95" y1="111" x2="95" y2="140" stroke="#3d3d3a" stroke-width="0.5"/>

<circle cx="585" cy="95" r="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="585" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">LT</text>
<text x="563" y="99" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3d3d3a">LT-3005</text>
<line x1="585" y1="111" x2="585" y2="140" stroke="#3d3d3a" stroke-width="0.5"/>

<circle cx="360" cy="95" r="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="360" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">FIC</text>
<text x="382" y="99" font-family="sans-serif" font-size="12" fill="#3d3d3a">FIC-1042</text>
<line x1="360" y1="111" x2="360" y2="180" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="4 3"/>

<!-- Vessels -->
<rect x="50" y="140" width="90" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="95" y="195" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">V-100</text>

<rect x="540" y="140" width="90" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="585" y="195" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">V-200</text>

<!-- Pump -->
<circle cx="210" cy="195" r="28" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="196" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">P-101</text>

<!-- Control valve (bowtie symbol) -->
<polygon points="330,180 330,210 360,195" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
<polygon points="390,180 390,210 360,195" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
<text x="360" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3d3d3a">FCV-1042</text>

<!-- Process piping -->
<line x1="140" y1="195" x2="182" y2="195" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="238" y1="195" x2="330" y2="195" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="390" y1="195" x2="540" y2="195" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="465" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3d3d3a">6"-P-1042-A1A-H</text>

<!-- Legend -->
<line x1="60" y1="300" x2="100" y2="300" stroke="#3d3d3a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="110" y="304" font-family="sans-serif" font-size="12" fill="#3d3d3a">Process piping</text>
<line x1="60" y1="325" x2="100" y2="325" stroke="#3d3d3a" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="110" y="329" font-family="sans-serif" font-size="12" fill="#3d3d3a">Instrument signal (dashed)</text>
</svg>
